---
# Change pip's cache directory to be inside the project directory
# since gitlab ci can only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  INTEGRATION_RUN_ID: "$CI_PROJECT_ID-$CI_PIPELINE_ID-$CI_JOB_ID"
  INTEGRATION_RUNNER_REF: "main"

stages:
  - unit_test
  - integration_test
  - publish_results

test:py27:
  stage: unit_test
  image: python:2.7.11-slim
  before_script:
    # pip 21.0 does not support py2 but the default pip in this container
    # is too old and fails. Hence the pip version must be 20.3.4.
    - pip install --trusted-host pypi.python.org --upgrade pip==20.3.4
    - python --version ; pip --version
    - pip install virtualenv
    - virtualenv venv27
    - source venv27/bin/activate
  script:
    - pip install -r tests/requirements-py27.txt
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key:
      files:
        - tests/requirements-py27.txt
    paths:
      - venv27/
      - .cache/pip


test:py38:
  stage: unit_test
  image: python:3.8.10-slim
  before_script:
    - pip install --upgrade pip
    - python --version ; pip --version
    - pip install virtualenv
    - virtualenv venv38
    - source venv38/bin/activate
  script:
    - pip install -r tests/requirements-py38.txt
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key:
      files:
        - tests/requirements-py38.txt
    paths:
      - venv38/
      - .cache/pip


# =============================================================================
# Integration Test Template
# =============================================================================
.integration_template: &integration_template
  stage: integration_test
  image: python:3.8.10-slim
  resource_group: aci_fabric_tests
  before_script:
    - echo 'ACQUIRE {http::proxy "$apt_proxy"}' >> /etc/apt/apt.conf
    - echo -e "$apt_source" > /etc/apt/sources.list
    - apt update
    - apt install -y curl
    - pip install --upgrade pip
    - python --version ; pip --version
    - pip install virtualenv
    - virtualenv venv38-integration
    - source venv38-integration/bin/activate
    - cd tests
    - 'curl --header "PRIVATE-TOKEN: $integration_repo_token" "$repo_url/requirements.txt/raw?ref=main" -o requirements.txt'
    - 'curl --fail --header "PRIVATE-TOKEN: $integration_repo_token" "$repo_url/runner.py/raw?ref=$INTEGRATION_RUNNER_REF" -o runner.py'
    - pip install -r requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - $CI_PROJECT_DIR/tests/*.log
      - $CI_PROJECT_DIR/tests/*.tgz
      - $CI_PROJECT_DIR/tests/fabric-results/
  cache:
    key:
      files:
        - tests/requirements.txt
    paths:
      - venv38-integration/
      - .cache/pip
  timeout: 45m
  retry:
    max: 1
    when: runner_system_failure

# Version overrides are omitted when publishing the actual-version snapshot.
.version_override_template: &version_override_template
  <<: *integration_template
  rules:
    - if: '$PUBLISH_ACTUAL_RESULTS == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
      when: on_success

# =============================================================================
# Integration Test - Actual Fabric Versions
# =============================================================================
test:integration:actual-current-version:
  <<: *integration_template
  script:
    - 'curl --header "PRIVATE-TOKEN: $integration_repo_token" "$repo_url/test_fabrics.yaml/raw?ref=main" -o test_fabrics.yaml'
    - |
      if [ "$PUBLISH_ACTUAL_RESULTS" = "true" ]; then
        if [ -n "$INTEGRATION_CHECK" ]; then
          echo "PUBLISH_ACTUAL_RESULTS requires a full run; unset INTEGRATION_CHECK."
          exit 1
        fi
        python3 runner.py -f ../aci-preupgrade-validation-script.py -i test_fabrics.yaml -k "$decode_key" --results-dir fabric-results
      else
        python3 runner.py -f ../aci-preupgrade-validation-script.py -i test_fabrics.yaml -k "$decode_key"
      fi

publish:actual-version-results:
  stage: publish_results
  image: python:3.8.10-slim
  resource_group: aci_results_publication
  dependencies:
    - test:integration:actual-current-version
  rules:
    - if: '$PUBLISH_ACTUAL_RESULTS == "true"'
      when: always
    - when: never
  before_script:
    - echo 'ACQUIRE {http::proxy "$apt_proxy"}' >> /etc/apt/apt.conf
    - echo -e "$apt_source" > /etc/apt/sources.list
    - apt update
    - apt install -y git ca-certificates
  script:
    - python3 -m unittest discover -s ci/tests -p 'test_*.py'
    - python3 ci/publish_integration_results.py tests/fabric-results
  timeout: 10m

# =============================================================================
# Integration Tests - 5.x Internal Upgrades
# =============================================================================
test:integration:5.2.4d-to-5.2.8f:
  <<: *version_override_template
  variables:
    FABRIC_CVERSION: "5.2(4d)"
    FABRIC_TVERSION: "5.2(8f)"
  script:
    - 'curl --header "PRIVATE-TOKEN: $integration_repo_token" "$repo_url/test_fabrics.yaml/raw?ref=main" -o test_fabrics.yaml'
    - python3 runner.py -f ../aci-preupgrade-validation-script.py -i test_fabrics.yaml -k $decode_key --cversion "$FABRIC_CVERSION" --tversion "$FABRIC_TVERSION"

